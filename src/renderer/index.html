<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <title>Termi</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/logo-mark.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="preload">
    <!-- Drawn window controls for Windows and Linux. macOS uses its own. -->
    <div class="traffic-lights" id="traffic-lights" hidden>
      <button class="light close" data-action="close" aria-label="Close window">
        <svg viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5" /></svg>
      </button>
      <button class="light minimize" data-action="minimize" aria-label="Minimize window">
        <svg viewBox="0 0 12 12"><path d="M3 6h6" /></svg>
      </button>
      <button class="light maximize" data-action="maximize" aria-label="Maximize window">
        <svg viewBox="0 0 12 12"><path d="M4 4h4v4" /><path d="M8 8H4V4" /></svg>
      </button>
    </div>

    <div class="app" id="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head drag">
          <div class="spacer"></div>
          <button class="icon-btn no-drag" id="hide-sidebar" title="Hide sidebar (⌘B)" aria-label="Hide sidebar">
            <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M9 4l0 16" /></svg>
          </button>
        </div>

        <div class="sidebar-scroll">
          <section class="section">
            <div class="section-head">
              <span class="section-title">Running</span>
              <span class="section-count" id="running-count">0</span>
              <button class="icon-btn small" id="add-terminal" title="New terminal (⌘T)" aria-label="New terminal">
                <svg viewBox="0 0 24 24"><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
              </button>
            </div>
            <ul class="list" id="terminal-list"></ul>
          </section>

          <section class="section">
            <div class="section-head">
              <span class="section-title">Saved commands</span>
              <button class="icon-btn small" id="add-command" title="New saved command (⇧⌘N)" aria-label="New saved command">
                <svg viewBox="0 0 24 24"><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
              </button>
            </div>
            <ul class="list" id="command-list"></ul>
            <button class="commands-empty" id="commands-empty" hidden>
              Save a command you run often. Turn on
              <svg class="inline-bolt" viewBox="0 0 24 24"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" /></svg>
              to start it when Termi opens.
            </button>
          </section>
        </div>

        <footer class="sidebar-foot">
          <div class="stat" id="stat-cpu">
            <svg viewBox="0 0 24 24"><path d="M5 6a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1l0 -12" /><path d="M9 9h6v6h-6l0 -6" /><path d="M3 10h2" /><path d="M3 14h2" /><path d="M10 3v2" /><path d="M14 3v2" /><path d="M21 10h-2" /><path d="M21 14h-2" /><path d="M14 21v-2" /><path d="M10 21v-2" /></svg>
            <span class="stat-bar"><span></span></span>
            <span class="stat-value">-</span>
          </div>
          <div class="stat net" id="stat-down" title="Download speed">
            <svg viewBox="0 0 24 24"><path d="M12 5l0 14" /><path d="M18 13l-6 6" /><path d="M6 13l6 6" /></svg>
            <span class="stat-value">-</span>
          </div>
          <div class="stat" id="stat-mem">
            <svg viewBox="0 0 24 24"><path d="M4 7h16a1 1 0 0 1 1 1v8a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1" /><path d="M7 10h3v4h-3z" /><path d="M14 10h3v4h-3z" /><path d="M7 17v3" /><path d="M12 17v3" /><path d="M17 17v3" /></svg>
            <span class="stat-bar"><span></span></span>
            <span class="stat-value">-</span>
          </div>
          <div class="stat net" id="stat-up" title="Upload speed">
            <svg viewBox="0 0 24 24"><path d="M12 5l0 14" /><path d="M18 11l-6 -6" /><path d="M6 11l6 -6" /></svg>
            <span class="stat-value">-</span>
          </div>
        </footer>
      </aside>

      <div class="resizer" id="resizer" title="Drag to resize"></div>

      <main class="main">
        <header class="main-head drag" id="main-head">
          <button class="icon-btn no-drag" id="show-sidebar" title="Show sidebar (⌘B)" aria-label="Show sidebar">
            <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M9 4l0 16" /></svg>
          </button>
          <div class="title">
            <img src="../../assets/logo-mark.svg" alt="" class="title-logo" />
            <span class="title-text" id="title-text">Termi</span>
            <span class="title-sub" id="title-sub"></span>
          </div>
          <!-- Shows when the tab has more than one terminal. -->
          <div class="layout-control" id="layout-control" role="radiogroup" aria-label="Layout"></div>
        </header>

        <div class="terminals" id="terminals">
          <div class="empty-state" id="empty-state" hidden>
            <img src="../../assets/logo.svg" alt="Termi logo" class="empty-logo" />
            <h1>Termi</h1>
            <p>No terminals are running.</p>
            <div class="empty-actions">
              <button class="btn primary" id="empty-new-terminal">New terminal <kbd>⌘T</kbd></button>
              <button class="btn" id="empty-new-command">Save a command</button>
            </div>
          </div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </main>
    </div>

    <dialog class="dialog" id="command-dialog">
      <form method="dialog" id="command-form" autocomplete="off">
        <div class="dialog-head">
          <img src="../../assets/logo-mark.svg" alt="" class="dialog-logo" />
          <h2 id="command-dialog-title">New saved command</h2>
        </div>

        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" name="name" placeholder="API server" required maxlength="60" />
        </label>

        <div class="field">
          <span class="field-label" id="command-label">Command</span>
          <div class="term-fields" id="term-fields"></div>
          <button type="button" class="add-term" id="add-term-field">
            <svg viewBox="0 0 24 24"><path d="M12 5l0 14" /><path d="M5 12l14 0" /></svg>
            Add terminal
          </button>
          <span class="field-hint">
            Each line runs in order, in your normal shell. Add up to 4 terminals to run them side by side in one tab.
          </span>
        </div>

        <div class="field">
          <span class="field-label">Folder</span>
          <div class="field-row">
            <input type="text" name="cwd" placeholder="~" spellcheck="false" />
            <button type="button" class="btn" id="pick-folder">
              <svg viewBox="0 0 24 24"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2" /></svg>
              Choose
            </button>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" name="autoStart" />
          <span class="check-box"></span>
          <span>
            <span class="check-title">Start when Termi opens</span>
            <span class="field-hint">Termi runs it in a new tab at launch.</span>
          </span>
        </label>

        <div class="dialog-actions">
          <button type="button" class="btn danger" id="delete-command" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" class="btn" id="cancel-command">Cancel</button>
          <button type="submit" class="btn primary" id="save-command">Save</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.ts"></script>
  </body>
</html>
