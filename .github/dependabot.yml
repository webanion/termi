# Monthly update pull requests for npm packages and for the actions the workflows pin by SHA.
# Every minor and patch update of an npm package arrives in one pull request, and every action
# update in another, so a month brings about two. A major version gets a pull request of its own,
# since a new Electron, node-pty, React or xterm.js major needs a run of the app to review.
# Commit subjects come out as chore(deps), chore(deps-dev) or chore(ci), so the commit check
# passes and the changelog files them under Other.
#
# Some majors cannot land on their own, so they are held here rather than opened as pull requests
# that fail npm ci. Remove a rule once what it waits for has shipped.
# - @types/node follows the Node that Electron bundles (Node 24 in Electron 44) and .nvmrc, so
#   its major moves by hand, with the Electron upgrade that changes Node.
# - TypeScript majors wait for typescript-eslint to accept them (8.70 accepts below 6.1).
# - Vite majors, and the @vitejs/plugin-react major that needs them, wait for electron-vite to
#   accept them (5.0 accepts Vite 5 to 7). electron-vite itself is not held, so its next major
#   arrives as a pull request, which is the signal to lift this rule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
