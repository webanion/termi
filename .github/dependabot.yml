# Monthly update pull requests for npm packages and for the actions the workflows pin by SHA.
# Every minor and patch update of an npm package arrives in one pull request, and every action
# update in another, so a month brings about two. A major version gets a pull request of its own,
# since a new Electron, node-pty, React or xterm.js major needs a run of the app to review.
# Commit subjects come out as chore(deps), chore(deps-dev) or chore(ci), so the commit check
# passes and the changelog files them under Other.
#
# Some majors cannot land on their own, so they are held here rather than opened as pull requests
# that fail npm ci. Remove a rule once what it waits for has shipped.
# - @types/node follows the Node that Electron bundles (Node 24 in Electron 45) and .nvmrc, so
#   its major moves by hand, with the Electron upgrade that changes Node.
# - TypeScript majors move by hand. TypeScript 7 ships no programmatic API until 7.1, and the
#   build and test tools that load TypeScript have to accept it first. The lint does not hold it
#   back: oxlint-tsgolint already runs on TypeScript 7's checker.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
